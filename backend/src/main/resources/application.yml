server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
      enabled: true
    # Vercel 前端与 Railway API 为跨站请求，必须允许跨站 Session Cookie
    session:
      cookie:
        http-only: true
        secure: true
        same-site: none

spring:
  profiles:
    active: dev
  config:
    import: optional:classpath:application-payment.yml
  application:
    name: lanlink-shopping
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # 邮箱验证码 SMTP 通道（环境变量驱动；未配置时自动回退 devCode 演示模式）
  # 例：QQ 邮箱 SMTP host=smtp.qq.com port=465，密码为「授权码」而非登录密码
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          # 超时机制：连接/读取/写入均 10 秒，避免 SMTP 无响应拖垮接口
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 敏感字段加密（AES-256-GCM）：商户税务登记号/企业统一社会信用代码
# 密钥支持 Base64(32字节) 或任意口令串（自动 SHA-256 派生）；生产环境必须通过环境变量 MERCHANT_CRYPTO_KEY 覆盖
lanlink:
  crypto:
    key: ${MERCHANT_CRYPTO_KEY:}
